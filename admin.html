<!DOCTYPE html>
<html>
<head>
    <title>DJ Admin Panel</title>
    <style>
        body { font-family: Arial; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #2a2a2a; padding: 30px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #ff6b6b; border: none; color: white; border-radius: 5px; cursor: pointer; }
        button:hover { background: #ee5a52; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color: red;"></p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    
    <!-- Tera Firebase Config -->
    <script src="firebase-config.js"></script>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            if (!email || !password) {
                errorDiv.textContent = 'Email aur Password dono dena!';
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(user => {
                    alert('Login successful! ' + user.user.email);
                    // Admin panel kholna
                    window.location.href = 'availability-manager.html';
                })
                .catch(error => {
                    errorDiv.textContent = 'Error: ' + error.message;
                });
        }
    </script>
</body>
</html>
